# Free Personal Team build: the app only.
#
# A Personal Team supports neither Push Notifications nor App Groups, and the
# widget needs App Groups to read the signed-in session. So this spec drops both
# paid capabilities and both extensions, leaving an app that signs and runs on a
# free Apple ID: sign in, see requests, approve/decline, WhatsApp.
#
#   xcodegen --spec project-free.yml
#
# Once enrolled in the Apple Developer Program, switch to the full spec and the
# widget and push come with it — the Swift sources are identical:
#
#   xcodegen
name: JHOps
options:
  bundleIdPrefix: in.jhselfdrive
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

# Info.plists are GENERATED by XcodeGen rather than hand-written, so the
# required bundle keys (CFBundleIdentifier, CFBundleExecutable,
# CFBundlePackageType) are always present. A hand-written plist that omits
# CFBundleIdentifier still builds, then fails at install with "not a valid
# bundle" — which is a miserable way to find out.
targets:
  JHOps:
    type: application
    platform: iOS
    sources:
      - path: JHOps
        excludes: ["Info.plist", "Info-free.plist"]
      - path: Shared
    info:
      path: JHOps/Info-free.plist
      properties:
        CFBundleDisplayName: JH Ops
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        OPS_API_HOST: $(OPS_API_HOST)
        OPS_API_SCHEME: $(OPS_API_SCHEME)
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.jhselfdrive.ops
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  JHOps:
    build:
      targets:
        JHOps: all
    run:
      config: Debug
    archive:
      config: Release
