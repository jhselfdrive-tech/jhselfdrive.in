name: JHOps
options:
  bundleIdPrefix: in.jhselfdrive
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"

configFiles:
  Debug: Config.debug.xcconfig
  Release: Config.release.xcconfig

# Info.plists are GENERATED by XcodeGen rather than hand-written, so the
# required bundle keys (CFBundleIdentifier, CFBundleExecutable,
# CFBundlePackageType) are always present. A hand-written plist that omits
# CFBundleIdentifier still builds, then fails at install with "not a valid
# bundle" — which is a miserable way to find out.
targets:
  JHOps:
    type: application
    platform: iOS
    sources:
      - path: JHOps
        excludes: ["Info.plist", "Info-free.plist"]
      - path: Shared
    info:
      path: JHOps/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: JH Ops
        NSCameraUsageDescription: Photograph vehicle condition and driving licences during handovers.
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        OPS_API_HOST: $(OPS_API_HOST)
        OPS_API_SCHEME: $(OPS_API_SCHEME)
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: in.jhselfdrive.ops
        CODE_SIGN_ENTITLEMENTS: JHOps/JHOps.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: JHOpsWidget
        embed: true
      - target: JHOpsNotify
        embed: true

  JHOpsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JHOps/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: JHOpsWidget
        excludes: ["Info.plist"]
      - path: Shared
    info:
      path: JHOpsWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: JH Ops
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        OPS_API_HOST: $(OPS_API_HOST)
        OPS_API_SCHEME: $(OPS_API_SCHEME)
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.jhselfdrive.ops.widget
        CODE_SIGN_ENTITLEMENTS: JHOpsWidget/JHOpsWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  JHOpsNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: JHOps/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: JHOpsNotify
        excludes: ["Info.plist"]
      - path: Shared
    info:
      path: JHOpsNotify/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: JH Ops Notify
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        OPS_API_HOST: $(OPS_API_HOST)
        OPS_API_SCHEME: $(OPS_API_SCHEME)
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.jhselfdrive.ops.notify
        CODE_SIGN_ENTITLEMENTS: JHOpsNotify/JHOpsNotify.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  JHOps:
    build:
      targets:
        JHOps: all
    run:
      config: Debug
    archive:
      config: Release
